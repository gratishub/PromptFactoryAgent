<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <title>Prompt Vault Atom Workspace</title>
  <script src="/static/tailwind.js"></script>
  <script src="/static/vue.js"></script>
  <script src="/static/marked.js"></script>
  <link
    rel="stylesheet"
    href="/static/github.css"
  />
  <script src="/static/highlight.js"></script>
  <style>
    .prose ul { list-style: disc; padding-left: 1.5em; }
    .prose ol { list-style: decimal; padding-left: 1.5em; }
    .prose li { margin-top: 0.25em; margin-bottom: 0.25em; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 overflow-x-hidden">
  <div id="app"></div>

  <script>
    const { createApp, computed, nextTick, onBeforeUnmount, onMounted, reactive, ref, watch } = Vue;

    marked.setOptions({
      breaks: true,
      gfm: true
    });

    createApp({
      setup() {
        const searchTimer = ref(null);
        const state = reactive({
          authenticated: false,
          loginForm: { username: "", password: "" },
          loggingIn: false,
          loading: false,
          saving: false,
          deleting: false,
          mining: false,
          optimizing: false,
          toast: null,
          prompts: [],
          availableTags: [],
          selectedTag: "",
          search: "",
          drawerOpen: false,
          drawerMode: "preview",
          currentPrompt: null,
          editor: { title: "", content: "", tagsText: "", category: "" },
          mineKeyword: "",
          previewVars: {},
          variableValues: {},
          vaults: [],
          currentVaultId: null,
          showVaultManager: false,
          newVaultName: "",
          newVaultSlug: "",
          vaultManagerError: null,
          versionHistory: [],
          viewingHistoryVersion: null,
          showHistoryPanel: false,
        });

        const filteredPromptCount = computed(() => state.prompts.length);
        const interpolatedContent = computed(() => {
          let content = state.editor.content || "";
          const matches = content.match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g) || [];
          const varNames = [...new Set(matches.map(v => v.replace(/\{\{\s*|\s*\}\}/g, "")))];
          for (const v of varNames) {
            const val = state.variableValues[v];
            if (val) {
              content = content.replace(new RegExp(`\\{\\{\\s*${v}\\s*\\}\\}`, "g"), val);
            }
          }
          return content;
        });

        const renderedMarkdown = computed(() => marked.parse(interpolatedContent.value || ""));

        const detectedVars = computed(() => {
          const matches = (state.editor.content || "").match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g) || [];
          return [...new Set(matches.map(v => v.replace(/\{\{\s*|\s*\}\}/g, "")))];
        });

        const renderedWithVars = computed(() => {
          let content = state.editor.content || "";
          for (const v of detectedVars.value) {
            const val = state.previewVars[v] || `{{ ${v} }}`;
            content = content.replace(new RegExp(`\\{\\{\\s*${v}\\s*\\}\\}`, "g"), val);
          }
          return marked.parse(content);
        });

        function showToast(message, type = "success") {
          state.toast = { message, type };
          window.setTimeout(() => {
            if (state.toast && state.toast.message === message) {
              state.toast = null;
            }
          }, 2000);
        }

        function clearSession() {
          state.authenticated = false;
          state.prompts = [];
          state.availableTags = [];
          state.drawerOpen = false;
          state.currentPrompt = null;
          state.variableValues = {};
          state.vaults = [];
          state.currentVaultId = null;
        }

        async function apiFetch(url, options = {}) {
          const headers = new Headers(options.headers || {});
          if (!(options.body instanceof FormData) && !headers.has("Content-Type")) {
            headers.set("Content-Type", "application/json");
          }
          const response = await fetch(url, { ...options, headers, credentials: "same-origin" });
          if (response.status === 401) {
            clearSession();
            showToast("登录已失效，请重新登录", "error");
            throw new Error("unauthorized");
          }
          return response;
        }

        function tagsToText(tags) {
          return (tags || []).join(", ");
        }

        function tagsFromText(text) {
          return text
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean);
        }

        async function login() {
          state.loggingIn = true;
          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(state.loginForm),
              credentials: "same-origin",
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(payload.detail || "登录失败");
            }
            state.authenticated = true;
            state.loginForm.password = "";
            await loadVaults();
            await loadPrompts(false);
            showToast("登录成功");
          } catch (error) {
            showToast(error.message || "登录失败", "error");
          } finally {
            state.loggingIn = false;
          }
        }

        async function loadPrompts(resetSelection = false) {
          if (!state.authenticated) return;
          state.loading = true;
          try {
            const params = new URLSearchParams();
            if (state.search.trim()) params.set("q", state.search.trim());
            if (state.selectedTag) params.set("tag", state.selectedTag);
            if (state.currentVaultId) params.set("vault_id", String(state.currentVaultId));
            params.set("limit", "60");
            params.set("offset", "0");
            const response = await apiFetch(`/api/prompts?${params.toString()}`);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(payload.detail || "加载失败");
            }
            state.prompts = payload.items || [];
            state.availableTags = payload.available_tags || [];
            if (resetSelection && state.prompts.length > 0) {
              await openPrompt(state.prompts[0].id);
            }
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "加载失败", "error");
            }
          } finally {
            state.loading = false;
          }
        }

        async function openPrompt(id) {
          try {
            const response = await apiFetch(`/api/prompts/${id}`);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(payload.detail || "读取详情失败");
            }
            state.currentPrompt = payload;
            state.editor.title = payload.title || "";
            state.editor.content = payload.content || "";
            state.editor.tagsText = tagsToText(payload.tags || []);
            state.editor.category = payload.category || "";
            state.variableValues = {};
            if (payload.variables && payload.variables.length > 0) {
              payload.variables.forEach(v => { state.variableValues[v] = ""; });
            }
            state.drawerOpen = true;
            state.showHistoryPanel = false;
            state.viewingHistoryVersion = null;
            await fetchVersionHistory(id);
            await nextTick();
            document.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "读取详情失败", "error");
            }
          }
        }

        function newPrompt() {
          state.currentPrompt = null;
          state.editor.title = "";
          state.editor.content = "";
          state.editor.tagsText = "";
          state.editor.category = "通用";
          state.drawerMode = "edit";
          state.drawerOpen = true;
          state.variableValues = {};
        }

        async function savePrompt() {
          state.saving = true;
          try {
            const payload = {
              title: state.editor.title,
              content: state.editor.content,
              tags: tagsFromText(state.editor.tagsText),
              category: state.editor.category || "通用",
              vault_id: state.currentVaultId,
            };
            const isUpdate = !!(state.currentPrompt && state.currentPrompt.id);
            const response = await apiFetch(
              isUpdate ? `/api/prompts/${state.currentPrompt.id}` : "/api/prompts",
              {
                method: isUpdate ? "PUT" : "POST",
                body: JSON.stringify(payload),
              }
            );
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "保存失败");
            }
            state.currentPrompt = body;
            state.editor.title = body.title;
            state.editor.content = body.content;
            state.editor.tagsText = tagsToText(body.tags || []);
            state.editor.category = body.category || "";
            await loadPrompts();
            state.drawerMode = "preview";
            showToast("保存成功");
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "保存失败", "error");
            }
          } finally {
            state.saving = false;
          }
        }

        async function deletePrompt() {
          if (!(state.currentPrompt && state.currentPrompt.id)) {
            showToast("当前提示词尚未保存", "error");
            return;
          }
          if (!window.confirm(`确认删除 ${state.currentPrompt.title} ?`)) {
            return;
          }
          state.deleting = true;
          try {
            const response = await apiFetch(`/api/prompts/${state.currentPrompt.id}`, {
              method: "DELETE",
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "删除失败");
            }
            state.drawerOpen = false;
            state.currentPrompt = null;
            await loadPrompts();
            showToast("删除成功");
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "删除失败", "error");
            }
          } finally {
            state.deleting = false;
          }
        }

        async function minePrompt() {
          if (!state.mineKeyword.trim()) {
            showToast("请输入挖掘关键词", "error");
            return;
          }
          state.mining = true;
          try {
            const response = await apiFetch("/api/mine-prompt", {
              method: "POST",
              body: JSON.stringify({ keyword: state.mineKeyword.trim(), vault_id: state.currentVaultId }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "挖掘失败");
            }
            await loadPrompts();
            await openPrompt(body.prompt.id);
            state.mineKeyword = "";
            showToast("提示词已挖掘入库");
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "挖掘失败", "error");
            }
          } finally {
            state.mining = false;
          }
        }

        async function copyPrompt() {
          try {
            await navigator.clipboard.writeText(interpolatedContent.value || "");
            showToast("已复制提示词");
          } catch (error) {
            showToast("复制失败", "error");
          }
        }

        async function optimizePromptContent() {
          if (!state.editor.content.trim()) {
            showToast("请先输入提示词内容", "error");
            return;
          }
          state.optimizing = true;
          try {
            const response = await apiFetch("/api/optimize-prompt", {
              method: "POST",
              body: JSON.stringify({ content: state.editor.content }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "优化失败");
            }
            state.editor.content = body.content || state.editor.content;
            if (!state.editor.title && body.title) {
              state.editor.title = body.title;
            }
            if (!state.editor.tagsText && body.tags && body.tags.length > 0) {
              state.editor.tagsText = body.tags.join(", ");
            }
            showToast("优化成功");
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "优化失败", "error");
            }
          } finally {
            state.optimizing = false;
          }
        }

        async function fetchVersionHistory(promptId) {
          try {
            const response = await apiFetch(`/api/prompts/${promptId}/versions`);
            const payload = await response.json().catch(() => []);
            if (!response.ok) throw new Error(payload.detail || "加载历史版本失败");
            state.versionHistory = payload || [];
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "加载历史版本失败", "error");
            }
          }
        }

        function viewHistoryContent(item) {
          state.viewingHistoryVersion = item;
        }

        function restoreVersion() {
          if (!state.viewingHistoryVersion) return;
          state.editor.content = state.viewingHistoryVersion.content;
          state.showHistoryPanel = false;
          state.viewingHistoryVersion = null;
          state.drawerMode = "edit";
          showToast("已载入历史内容，点击保存即可生成新版本");
        }

        function logout() {
          apiFetch("/api/logout", { method: "POST" })
            .catch(() => null)
            .finally(() => {
              clearSession();
              showToast("已退出登录");
            });
        }

        async function loadVaults() {
          try {
            const response = await apiFetch("/api/vaults");
            const payload = await response.json().catch(() => []);
            if (!response.ok) throw new Error(payload.detail || "加载知识库失败");
            state.vaults = payload || [];
            if (state.vaults.length > 0) {
              if (!state.currentVaultId) {
                state.currentVaultId = state.vaults[0].id;
              } else {
                const stillExists = state.vaults.some(v => v.id === state.currentVaultId);
                if (!stillExists) {
                  state.currentVaultId = state.vaults[0].id;
                }
              }
            }
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "加载知识库失败", "error");
            }
          }
        }

        async function createVault() {
          if (!state.newVaultName.trim() || !state.newVaultSlug.trim()) {
            state.vaultManagerError = "名称和标识符不能为空";
            return;
          }
          state.vaultManagerError = null;
          try {
            const response = await apiFetch("/api/vaults", {
              method: "POST",
              body: JSON.stringify({ name: state.newVaultName.trim(), slug: state.newVaultSlug.trim() }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "创建失败");
            }
            state.newVaultName = "";
            state.newVaultSlug = "";
            await loadVaults();
            showToast("知识库创建成功");
          } catch (error) {
            if (error.message !== "unauthorized") {
              state.vaultManagerError = error.message || "创建失败";
            }
          }
        }

        async function deleteVault(vaultId) {
          if (!window.confirm("确认删除该知识库？其中的所有提示词将被永久移除。")) return;
          try {
            const response = await apiFetch(`/api/vaults/${vaultId}`, { method: "DELETE" });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(body.detail || "删除失败");
            }
            if (state.currentVaultId === vaultId) {
              state.currentVaultId = null;
            }
            await loadVaults();
            await loadPrompts();
            showToast("知识库已删除");
          } catch (error) {
            if (error.message !== "unauthorized") {
              showToast(error.message || "删除失败", "error");
            }
          }
        }

        function openVaultManager() {
          state.vaultManagerError = null;
          state.newVaultName = "";
          state.newVaultSlug = "";
          state.showVaultManager = true;
        }

        function vaultSlugFromName() {
          if (state.newVaultSlug) return;
          state.newVaultSlug = state.newVaultName.trim()
            .toLowerCase()
            .replace(/[^\w\-.一-鿿]+/g, "-")
            .replace(/-{2,}/g, "-")
            .replace(/^-|-$/g, "");
        }

        function closeDrawer() {
          state.drawerOpen = false;
        }

        function debouncedSearch() {
          if (searchTimer.value) {
            window.clearTimeout(searchTimer.value);
          }
          searchTimer.value = window.setTimeout(() => {
            loadPrompts();
          }, 280);
        }

        function onSearchEnter() {
          if (searchTimer.value) {
            window.clearTimeout(searchTimer.value);
          }
          loadPrompts();
        }

        function toggleTag(tag) {
          state.selectedTag = state.selectedTag === tag ? "" : tag;
          loadPrompts();
        }

        function handleShortcut(event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s" && state.drawerOpen) {
            event.preventDefault();
            savePrompt();
          }
        }

        watch(
          () => state.drawerMode,
          async (mode) => {
            if (mode === "preview") {
              await nextTick();
              document.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
            }
          }
        );

        watch(
          () => state.currentVaultId,
          async (newId) => {
            if (newId && state.authenticated) {
              await loadPrompts();
            }
          }
        );

        async function restoreSession() {
          try {
            const response = await apiFetch("/api/session");
            if (!response.ok) {
              throw new Error("unauthorized");
            }
            state.authenticated = true;
            await loadVaults();
            await loadPrompts(true);
          } catch (error) {
            clearSession();
          }
        }

        onMounted(async () => {
          window.addEventListener("keydown", handleShortcut);
          await restoreSession();
        });

        onBeforeUnmount(() => {
          window.removeEventListener("keydown", handleShortcut);
          if (searchTimer.value) {
            window.clearTimeout(searchTimer.value);
          }
        });

        return {
          state,
          filteredPromptCount,
          interpolatedContent,
          renderedMarkdown,
          detectedVars,
          renderedWithVars,
          login,
          logout,
          loadPrompts,
          openPrompt,
          newPrompt,
          savePrompt,
          deletePrompt,
          copyPrompt,
          closeDrawer,
          debouncedSearch,
          onSearchEnter,
          toggleTag,
          minePrompt,
          restoreSession,
          optimizePromptContent,
          fetchVersionHistory,
          viewHistoryContent,
          restoreVersion,
          loadVaults,
          createVault,
          deleteVault,
          openVaultManager,
          vaultSlugFromName,
        };
      },
      template: `
        <div class="min-h-screen">
          <transition name="fade">
            <div v-if="state.toast" class="fixed right-6 top-6 z-[80]">
              <div
                class="rounded-2xl border px-4 py-3 shadow-lg backdrop-blur"
                :class="state.toast.type === 'error'
                  ? 'border-rose-200 bg-white/90 text-rose-700'
                  : 'border-emerald-200 bg-white/90 text-emerald-700'"
              >
                {{ state.toast.message }}
              </div>
            </div>
          </transition>

          <div
            v-if="!state.authenticated"
            class="flex min-h-screen items-center justify-center bg-[radial-gradient(circle_at_top,_rgba(148,163,184,0.2),_transparent_35%),linear-gradient(180deg,_#f8fafc_0%,_#eef2ff_100%)] p-6"
          >
            <div class="w-full max-w-md rounded-[2rem] border border-white/60 bg-white/70 p-8 shadow-2xl shadow-slate-200/60 backdrop-blur-xl">
              <div class="mb-8">
                <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Prompt Vault</p>
                <h1 class="mt-3 text-3xl font-semibold text-slate-900">安全登录</h1>
                <p class="mt-2 text-sm text-slate-500">进入原子卡片搜索工作台。</p>
              </div>
              <div class="space-y-4">
                <input
                  v-model="state.loginForm.username"
                  type="text"
                  placeholder="Username"
                  class="w-full rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 text-base outline-none transition focus:border-slate-900"
                />
                <input
                  v-model="state.loginForm.password"
                  type="password"
                  placeholder="Password"
                  class="w-full rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 text-base outline-none transition focus:border-slate-900"
                  @keyup.enter="login"
                />
                <button
                  class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-60"
                  :disabled="state.loggingIn"
                  @click="login"
                >
                  {{ state.loggingIn ? '登录中...' : '登录' }}
                </button>
              </div>
            </div>
          </div>

          <div v-else class="min-h-screen">
            <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
              <div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-y-4 gap-x-2 px-4 py-4 md:flex-nowrap md:gap-4 md:px-6">
                <div class="flex items-center gap-3 md:min-w-[200px]">
                  <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-900 text-lg font-semibold text-white shadow-lg shadow-slate-300">P</div>
                  <div>
                    <div class="hidden sm:block text-xs uppercase tracking-[0.35em] text-slate-400">Atom Workspace</div>
                    <div class="text-lg font-semibold text-slate-900">Prompt Vault</div>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <select
                    v-model="state.currentVaultId"
                    class="rounded-2xl border border-slate-200 bg-white px-3 py-3 text-sm font-medium text-slate-700 outline-none transition focus:border-slate-900 appearance-none cursor-pointer"
                    style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23475569%22 stroke-width=%222%22><path d=%22m6 9 6 6 6-6%22/></svg>');background-repeat:no-repeat;background-position:right 0.75rem center;padding-right:2.25rem;"
                  >
                    <option v-for="v in state.vaults" :key="v.id" :value="v.id">
                      {{ v.name }} ({{ v.prompt_count }})
                    </option>
                  </select>
                  <button
                    class="flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-500 hover:border-slate-900 hover:text-slate-900 transition"
                    title="知识库管理"
                    @click="openVaultManager"
                  >
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="3"></circle>
                      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                  </button>
                </div>

                <div class="relative order-last w-full md:order-none md:flex-1">
                  <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                  </svg>
                  <input
                    v-model="state.search"
                    @input="debouncedSearch"
                    @keyup.enter="onSearchEnter"
                    type="text"
                    placeholder="搜索标题或内容..."
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3 pl-12 pr-4 text-base outline-none transition focus:border-slate-900"
                  />
                </div>

                <div class="flex items-center gap-2 md:gap-3">
                  <input
                    v-model="state.mineKeyword"
                    type="text"
                    placeholder="输入关键词后挖掘"
                    class="w-[100px] sm:w-[140px] md:w-auto rounded-2xl border border-slate-200 bg-white px-3 py-2 md:px-4 md:py-3 text-base outline-none transition focus:border-slate-900"
                  />
                  <button
                    class="whitespace-nowrap rounded-2xl border border-slate-200 bg-white px-3 py-2 md:px-4 md:py-3 text-sm font-medium text-slate-700 hover:border-slate-900 hover:text-slate-900 disabled:opacity-60"
                    :disabled="state.mining"
                    @click="minePrompt"
                  >
                    {{ state.mining ? '挖掘中...' : '发起挖掘' }}
                  </button>
                  <button
                    class="whitespace-nowrap rounded-2xl bg-slate-900 px-3 py-2 md:px-4 md:py-3 text-sm font-medium text-white hover:bg-slate-800"
                    @click="logout"
                  >
                    退出登录
                  </button>
                </div>
              </div>
            </header>

            <div class="mx-auto grid max-w-[1600px] grid-cols-1 gap-6 px-4 py-6 md:px-6 xl:grid-cols-[280px_minmax(0,1fr)]">
              <aside class="space-y-6">
                <section class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Filters</p>
                      <h2 class="mt-2 text-lg font-semibold text-slate-900">标签 / 分类云</h2>
                    </div>
                    <button
                      class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-medium text-slate-500 hover:border-slate-900 hover:text-slate-900"
                      @click="newPrompt"
                    >
                      新建
                    </button>
                  </div>
                  <div class="mt-5 flex flex-wrap gap-2">
                    <button
                      class="rounded-full border px-3 py-2 text-xs font-medium transition"
                      :class="state.selectedTag === ''
                        ? 'border-slate-900 bg-slate-900 text-white'
                        : 'border-slate-200 bg-slate-50 text-slate-600 hover:border-slate-900 hover:text-slate-900'"
                      @click="toggleTag('')"
                    >
                      全部
                    </button>
                    <button
                      v-for="tag in state.availableTags"
                      :key="tag"
                      class="rounded-full border px-3 py-2 text-xs font-medium transition"
                      :class="state.selectedTag === tag
                        ? 'border-slate-900 bg-slate-900 text-white'
                        : 'border-slate-200 bg-slate-50 text-slate-600 hover:border-slate-900 hover:text-slate-900'"
                      @click="toggleTag(tag)"
                    >
                      {{ tag }}
                    </button>
                  </div>
                </section>
              </aside>

              <main class="space-y-5">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Results</p>
                    <h2 class="mt-2 text-2xl font-semibold text-slate-900">原子卡片搜索工作台</h2>
                    <p class="mt-2 text-sm text-slate-500">共 {{ filteredPromptCount }} 条匹配结果</p>
                  </div>
                </div>

                <div v-if="state.loading" class="rounded-[2rem] border border-slate-200 bg-white p-10 text-center text-sm text-slate-400 shadow-sm">
                  正在加载提示词数据...
                </div>

                <div
                  v-else-if="state.prompts.length === 0"
                  class="rounded-[2rem] border border-dashed border-slate-300 bg-white/80 p-12 text-center shadow-sm"
                >
                  <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Empty</p>
                  <h3 class="mt-3 text-2xl font-semibold text-slate-900">没有匹配的提示词</h3>
                  <p class="mt-3 text-sm text-slate-500">调整搜索条件、切换标签，或新建一条提示词。</p>
                </div>

                <div v-else class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3">
                  <article
                    v-for="item in state.prompts"
                    :key="item.id"
                    @click="openPrompt(item.id)"
                    class="group cursor-pointer rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-200/70"
                  >
                    <div class="flex items-start justify-between gap-3">
                      <h3 class="line-clamp-2 text-lg font-semibold text-slate-900">{{ item.title }}</h3>
                      <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">
                        {{ item.category }}
                      </span>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2">
                      <span
                        v-for="tag in item.tags.slice(0, 3)"
                        :key="tag"
                        class="rounded-full bg-slate-50 px-2.5 py-1 text-xs text-slate-500"
                      >
                        {{ tag }}
                      </span>
                    </div>
                    <p class="mt-4 text-sm leading-7 text-slate-600 whitespace-pre-wrap break-words [overflow-wrap:anywhere]">
                      {{ item.excerpt }}
                    </p>
                    <div class="mt-5 text-xs text-slate-400">
                      最近更新：{{ new Date(item.updated_at).toLocaleString() }}
                    </div>
                  </article>
                </div>
              </main>
            </div>

            <transition name="slide">
              <div v-if="state.drawerOpen" class="fixed inset-0 z-40 flex justify-end bg-slate-950/30 backdrop-blur-[2px]">
                <div class="flex h-full w-full max-w-4xl flex-col bg-white shadow-2xl shadow-slate-300/60 overflow-hidden"
                     style="padding-bottom:env(safe-area-inset-bottom);">
                  <div class="flex items-center justify-between border-b border-slate-200 px-4 py-4 sm:px-6 sm:py-5">
                    <div>
                      <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Prompt Detail</p>
                      <h3 class="mt-2 text-2xl font-semibold text-slate-900">
                        {{ state.currentPrompt ? state.currentPrompt.title : '新建提示词' }}
                      </h3>
                    </div>
                    <button
                      class="rounded-2xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 hover:border-slate-900 hover:text-slate-900"
                      @click="closeDrawer"
                    >
                      关闭
                    </button>
                  </div>

                  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-200 px-4 py-4 sm:px-6 sm:py-4">
                    <div class="flex rounded-2xl border border-slate-200 bg-slate-50 p-1 w-full sm:w-auto overflow-x-auto">
                      <button
                        class="rounded-xl px-3 py-2 text-sm font-medium transition whitespace-nowrap"
                        :class="state.drawerMode === 'edit' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'"
                        @click="state.drawerMode = 'edit'"
                      >
                        编辑模式
                      </button>
                      <button
                        class="rounded-xl px-3 py-2 text-sm font-medium transition whitespace-nowrap"
                        :class="state.drawerMode === 'preview' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'"
                        @click="state.drawerMode = 'preview'"
                      >
                        预览模式
                      </button>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">
                      <button
                        class="rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-3 py-2 sm:px-4 sm:py-2.5 text-sm font-medium text-slate-600 hover:border-slate-900 hover:text-slate-900 disabled:opacity-40"
                        :disabled="!state.currentPrompt"
                        @click="state.showHistoryPanel = !state.showHistoryPanel; state.viewingHistoryVersion = null;"
                      >
                        🕒 历史版本
                      </button>
                      <button
                        class="rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-3 py-2 sm:px-4 sm:py-2.5 text-sm font-medium text-slate-600 hover:border-slate-900 hover:text-slate-900"
                        @click="copyPrompt"
                      >
                        复制
                      </button>
                      <button
                        class="rounded-xl sm:rounded-2xl border border-rose-200 bg-white px-3 py-2 sm:px-4 sm:py-2.5 text-sm font-medium text-rose-600 hover:bg-rose-50 disabled:opacity-60"
                        :disabled="state.deleting"
                        @click="deletePrompt"
                      >
                        {{ state.deleting ? '删除中...' : '删除' }}
                      </button>
                      <button
                        class="rounded-xl sm:rounded-2xl bg-slate-900 px-3 py-2 sm:px-4 sm:py-2.5 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-60"
                        :disabled="state.saving"
                        @click="savePrompt"
                      >
                        {{ state.saving ? '保存中...' : '保存' }}
                      </button>
                    </div>
                  </div>

                  <div class="flex-1 overflow-y-auto overflow-x-hidden px-4 py-4 sm:px-6 sm:py-6">
                    <!-- History Panel -->
                    <div v-if="state.showHistoryPanel" class="flex flex-col h-full">
                      <div class="flex items-center justify-between mb-4">
                        <button
                          class="rounded-xl border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 hover:border-slate-900 hover:text-slate-900 transition"
                          @click="state.showHistoryPanel = false; state.viewingHistoryVersion = null;"
                        >
                          ← 返回编辑
                        </button>
                        <span class="text-sm text-slate-400">共 {{ state.versionHistory.length }} 个历史版本</span>
                      </div>
                      <div class="flex flex-col lg:flex-row gap-4 flex-1 min-h-0">
                        <div class="lg:w-56 flex-shrink-0 space-y-2 overflow-y-auto">
                          <div v-if="state.versionHistory.length === 0" class="text-sm text-slate-400 text-center py-12">
                            暂无历史版本
                          </div>
                          <button
                            v-for="item in state.versionHistory"
                            :key="item.id"
                            @click="viewHistoryContent(item)"
                            class="w-full text-left rounded-2xl border px-4 py-3 transition"
                            :class="state.viewingHistoryVersion && state.viewingHistoryVersion.id === item.id
                              ? 'border-slate-900 bg-slate-900 text-white'
                              : 'border-slate-200 bg-white hover:border-slate-400 hover:shadow-sm'"
                          >
                            <div class="flex items-center gap-2">
                              <span class="rounded-lg px-2 py-0.5 text-xs font-bold"
                                :class="state.viewingHistoryVersion && state.viewingHistoryVersion.id === item.id
                                  ? 'bg-white/20 text-white'
                                  : 'bg-slate-100 text-slate-700'"
                              >v{{ item.version }}</span>
                              <span v-if="item.version === state.currentPrompt?.version" class="text-[10px] text-amber-500 font-medium">当前</span>
                            </div>
                            <div class="text-xs mt-1.5"
                              :class="state.viewingHistoryVersion && state.viewingHistoryVersion.id === item.id ? 'text-slate-300' : 'text-slate-400'"
                            >{{ new Date(item.created_at).toLocaleString() }}</div>
                          </button>
                        </div>
                        <div class="flex-1 min-h-0 overflow-y-auto">
                          <div v-if="state.viewingHistoryVersion" class="space-y-4">
                            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5">
                              <pre class="text-sm leading-6 text-slate-700 whitespace-pre-wrap font-mono">{{ state.viewingHistoryVersion.content }}</pre>
                            </div>
                            <button
                              @click="restoreVersion"
                              class="w-full rounded-2xl bg-amber-500 px-4 py-3 text-sm font-semibold text-white hover:bg-amber-600 shadow-lg shadow-amber-200 transition"
                            >
                              🔄 基于此版本恢复
                            </button>
                            <p class="text-xs text-slate-400 text-center">点击恢复将载入历史内容到编辑器，需手动保存以生成新版本。</p>
                          </div>
                          <div v-else class="flex items-center justify-center h-full text-sm text-slate-400">
                            请选择一个历史版本查看
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- Normal Content -->
                    <div v-else>
                      <div v-if="state.drawerMode === 'edit'" class="space-y-5">
                        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                          <div>
                            <label class="mb-2 block text-sm sm:text-base font-medium text-slate-600">标题</label>
                            <input
                              v-model="state.editor.title"
                              type="text"
                              class="w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-slate-900"
                            />
                          </div>
                          <div>
                            <label class="mb-2 block text-sm sm:text-base font-medium text-slate-600">分类</label>
                            <input
                              v-model="state.editor.category"
                              type="text"
                              class="w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-slate-900"
                            />
                          </div>
                        </div>
                        <div>
                          <label class="mb-2 block text-sm sm:text-base font-medium text-slate-600">标签</label>
                          <input
                            v-model="state.editor.tagsText"
                            type="text"
                            placeholder="#分类/通用, #主题/Agent"
                            class="w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-slate-900"
                          />
                        </div>
                        <div>
                          <label class="mb-2 block text-sm sm:text-base font-medium text-slate-600">提示词内容</label>
                          <div class="relative">
                            <textarea
                              v-model="state.editor.content"
                              class="min-h-[300px] md:min-h-[420px] w-full rounded-2xl border border-slate-200 bg-white p-4 sm:p-5 font-mono text-base leading-6 sm:leading-7 text-slate-800 outline-none transition focus:border-slate-900 focus:ring-0 focus:outline-none appearance-none resize-none"
                              style="overflow-wrap:normal;white-space:pre-wrap;word-break:break-word;-webkit-appearance:none;appearance:none;"
                            ></textarea>
                            <button
                              class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 rounded-xl sm:rounded-2xl bg-gradient-to-r from-violet-600 to-purple-600 px-3 py-2 sm:px-4 sm:py-2.5 text-sm font-medium text-white shadow-lg shadow-violet-200 hover:from-violet-700 hover:to-purple-700 disabled:opacity-60"
                              :disabled="state.optimizing"
                              @click="optimizePromptContent"
                            >
                              {{ state.optimizing ? '优化中...' : '✨ AI 优化' }}
                            </button>
                          </div>
                        </div>
                      </div>

                      <article
                        v-else
                        class="space-y-4"
                      >
                        <div v-if="detectedVars.length > 0" class="rounded-[1.5rem] border border-violet-200 bg-gradient-to-r from-violet-50 to-purple-50 p-5">
                          <p class="mb-3 text-xs font-medium uppercase tracking-widest text-violet-400">动态变量填充</p>
                          <div class="flex flex-wrap gap-3">
                            <div v-for="v in detectedVars" :key="v" class="flex items-center gap-2">
                              <label class="rounded-xl bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm">{{ v }}</label>
                              <input
                                v-model="state.previewVars[v]"
                                type="text"
                                :placeholder="'{{ ' + v + ' }}'"
                                class="w-40 rounded-xl border border-violet-200 bg-white px-3 py-1.5 text-sm outline-none transition focus:border-violet-500"
                              />
                            </div>
                          </div>
                        </div>
                        <div
                          v-if="state.currentPrompt && state.currentPrompt.variables && state.currentPrompt.variables.length > 0"
                          class="rounded-[1.5rem] border border-indigo-200 bg-indigo-50/50 p-5"
                        >
                          <p class="mb-3 text-xs font-medium uppercase tracking-widest text-indigo-400">💡 动态变量配置</p>
                          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div v-for="varName in state.currentPrompt.variables" :key="varName">
                              <label class="mb-1.5 block text-sm font-medium text-slate-600">{{ varName }}</label>
                              <input
                                v-model="state.variableValues[varName]"
                                type="text"
                                :placeholder="'{{ ' + varName + ' }}'"
                                class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                              />
                            </div>
                          </div>
                        </div>
                        <article
                          class="prose prose-slate max-w-none rounded-[2rem] border border-slate-200 bg-slate-50 p-8 shadow-sm break-words [overflow-wrap:anywhere]"
                          v-html="detectedVars.length > 0 ? renderedWithVars : renderedMarkdown"
                        ></article>
                      </article>
                    </div>
                  </div>
                </div>
              </div>
            </transition>

            <transition name="fade">
              <div v-if="state.showVaultManager" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 backdrop-blur-[2px] p-4">
                <div class="w-full max-w-lg rounded-[2rem] border border-white/60 bg-white/90 p-8 shadow-2xl shadow-slate-300/60 backdrop-blur-xl">
                  <div class="flex items-center justify-between mb-6">
                    <div>
                      <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Manage</p>
                      <h2 class="mt-2 text-2xl font-semibold text-slate-900">知识库管理</h2>
                    </div>
                    <button
                      class="rounded-2xl border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 hover:border-slate-900 hover:text-slate-900"
                      @click="state.showVaultManager = false"
                    >
                      关闭
                    </button>
                  </div>

                  <div class="space-y-3 mb-6">
                    <div v-for="v in state.vaults" :key="v.id" class="flex items-center justify-between rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
                      <div>
                        <p class="text-sm font-semibold text-slate-900">{{ v.name }}</p>
                        <p class="text-xs text-slate-400">slug: {{ v.slug }} · {{ v.prompt_count }} 条提示词</p>
                      </div>
                      <button
                        v-if="v.id !== 1"
                        class="rounded-xl border border-rose-200 bg-white px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50 transition"
                        @click="deleteVault(v.id)"
                      >
                        删除
                      </button>
                      <span v-else class="rounded-xl bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-400">
                        默认
                      </span>
                    </div>
                  </div>

                  <div class="border-t border-slate-200 pt-6">
                    <p class="mb-4 text-sm font-semibold text-slate-700">新建知识库</p>
                    <div v-if="state.vaultManagerError" class="mb-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
                      {{ state.vaultManagerError }}
                    </div>
                    <div class="space-y-3">
                      <input
                        v-model="state.newVaultName"
                        @input="vaultSlugFromName"
                        type="text"
                        placeholder="知识库名称"
                        class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-slate-900"
                      />
                      <input
                        v-model="state.newVaultSlug"
                        type="text"
                        placeholder="标识符 (slug)"
                        class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-slate-900"
                      />
                      <button
                        class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white hover:bg-slate-800 transition"
                        @click="createVault"
                      >
                        新建知识库
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </transition>
          </div>
        </div>
      `,
    }).mount("#app");
  </script>

  <style>
    .fade-enter-active,
    .fade-leave-active,
    .slide-enter-active,
    .slide-leave-active {
      transition: all 0.24s ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-6px);
    }
    .slide-enter-from,
    .slide-leave-to {
      opacity: 0;
    }
    .slide-enter-from > div,
    .slide-leave-to > div {
      transform: translateX(24px);
    }
    pre,
    code {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    input, textarea, select {
      font-size: 16px !important;
    }
  </style>
</body>
</html>
