server:
  host: 0.0.0.0
  port: 8110

security:
  username: "your_admin_username"
  password: "your_strong_password_here"
  jwt_secret_key: "your_jwt_secret_key_here"
  jwt_algorithm: "HS256"
  cookie_secure: null

llm:
  api_key: "sk-your-api-key-here"
  base_url: "https://api.minimaxi.com/v1"
  model_name: "MiniMax-M2.7"

crawler:
  jina_base_url: "https://r.jina.ai/https://html.duckduckgo.com/html/?q="
  jina_api_key: ""

storage:
  vault_path: "./vault"
  allowed_export_paths:
    - "./vault"

# Security note:
# Production secrets should be injected from environment variables instead of being stored in config.yaml.
# Supported overrides:
# PROMPT_MINER_USERNAME
# PROMPT_MINER_PASSWORD
# PROMPT_MINER_JWT_SECRET_KEY
# PROMPT_MINER_LLM_API_KEY
# PROMPT_MINER_LLM_BASE_URL
# PROMPT_MINER_LLM_MODEL_NAME
# PROMPT_MINER_JINA_API_KEY
# PROMPT_MINER_COOKIE_SECURE
# PROMPT_MINER_ALLOWED_EXPORT_PATHS
